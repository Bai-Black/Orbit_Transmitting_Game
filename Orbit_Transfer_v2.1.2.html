<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>轨道转移</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
body { position: fixed; inset: 0; font-family: monospace; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

#touch-controls, #orientation-overlay { display: none; }
body.touch-enabled.state-playing:not(.portrait-blocked) #touch-controls { display: block; }

#touch-controls { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#joystick-zone {
  position: absolute;
  left: env(safe-area-inset-left);
  bottom: env(safe-area-inset-bottom);
  width: calc(46vw - env(safe-area-inset-left));
  height: calc(62vh - env(safe-area-inset-bottom));
  pointer-events: auto;
  touch-action: none;
}
#joystick {
  position: absolute;
  left: 18px;
  bottom: 18px;
  width: clamp(92px, 24vh, 132px);
  aspect-ratio: 1;
  border: 2px solid rgba(255,255,255,.72);
  border-radius: 50%;
  background: rgba(0,0,0,.3);
  pointer-events: none;
  transition: opacity .12s ease;
  opacity: .72;
}
#joystick::before, #joystick::after {
  content: '';
  position: absolute;
  background: rgba(255,255,255,.18);
  pointer-events: none;
}
#joystick::before { left: 50%; top: 8%; bottom: 8%; width: 1px; }
#joystick::after { top: 50%; left: 8%; right: 8%; height: 1px; }
#joystick-knob {
  position: absolute;
  left: 50%; top: 50%;
  width: 38%; aspect-ratio: 1;
  border: 2px solid #fff;
  border-radius: 50%;
  background: rgba(255,255,255,.14);
  transform: translate(-50%, -50%);
  pointer-events: none;
}
#joystick-label, #throttle-label {
  position: absolute;
  color: rgba(255,255,255,.72);
  font-size: 10px;
  letter-spacing: 2px;
  white-space: nowrap;
  pointer-events: none;
}
#joystick-label { left: 50%; top: -18px; transform: translateX(-50%); }

#throttle-control {
  position: absolute;
  right: max(40px, calc(env(safe-area-inset-right) + 18px));
  bottom: max(18px, env(safe-area-inset-bottom));
  width: clamp(58px, 14vh, 78px);
  height: clamp(130px, 39vh, 210px);
  pointer-events: none;
}
#throttle-track {
  position: absolute;
  inset: 0 15%;
  border: 2px solid rgba(255,255,255,.72);
  background: rgba(0,0,0,.3);
  pointer-events: auto;
  touch-action: none;
}
#throttle-fill {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 0%;
  background: rgba(255,255,255,.16);
  pointer-events: none;
}
#throttle-handle {
  position: absolute;
  left: -28%; right: -28%; bottom: 0%;
  height: 12px;
  border: 2px solid #fff;
  background: #000;
  transform: translateY(50%);
  pointer-events: none;
}
#throttle-label { left: 50%; top: -18px; transform: translateX(-50%); }
#throttle-value {
  position: absolute;
  left: 50%; bottom: -18px;
  color: #fff;
  font-size: 10px;
  transform: translateX(-50%);
  pointer-events: none;
}

#pause-button {
  position: absolute;
  top: max(12px, env(safe-area-inset-top));
  right: max(14px, env(safe-area-inset-right));
  width: 42px; height: 36px;
  border: 1px solid rgba(255,255,255,.72);
  background: rgba(0,0,0,.42);
  color: #fff;
  font: 18px monospace;
  pointer-events: auto;
  touch-action: manipulation;
}

body.touch-enabled.portrait-blocked #orientation-overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 24px;
  background: #000;
  color: #fff;
  text-align: center;
  pointer-events: auto;
}
#rotate-icon { font-size: 44px; transform: rotate(90deg); }
#orientation-overlay strong { font-size: 20px; letter-spacing: 3px; }
#orientation-overlay span { color: #888; font-size: 12px; }

@media (max-height: 390px) {
  #joystick { width: 88px; }
  #throttle-control { height: 125px; width: 56px; }
  #pause-button { width: 38px; height: 32px; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch-controls" aria-hidden="true">
  <div id="joystick-zone">
    <div id="joystick">
      <span id="joystick-label">方向</span>
      <div id="joystick-knob"></div>
    </div>
  </div>
  <div id="throttle-control">
    <span id="throttle-label">油门</span>
    <div id="throttle-track">
      <div id="throttle-fill"></div>
      <div id="throttle-handle"></div>
    </div>
    <span id="throttle-value">0%</span>
  </div>
  <button id="pause-button" type="button" aria-label="暂停">Ⅱ</button>
</div>
<div id="orientation-overlay" role="status" aria-live="polite">
  <div id="rotate-icon">▱</div>
  <strong>请旋转手机</strong>
  <span>横屏后继续游戏</span>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const joystickZone = document.getElementById('joystick-zone');
const joystick = document.getElementById('joystick');
const joystickKnob = document.getElementById('joystick-knob');
const throttleTrack = document.getElementById('throttle-track');
const throttleFill = document.getElementById('throttle-fill');
const throttleHandle = document.getElementById('throttle-handle');
const throttleValue = document.getElementById('throttle-value');
const pauseButton = document.getElementById('pause-button');

const touchEnabled = navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches;
const MOBILE_WORLD_SCALE = 0.7;
document.body.classList.toggle('touch-enabled', touchEnabled);
let portraitBlocked = false;
let initialResize = true;
let fullscreenRequestPending = false;
let mobileStartArmed = false;

function requestMobileFullscreen() {
  if (!touchEnabled || document.fullscreenElement || document.webkitFullscreenElement || fullscreenRequestPending) return;

  const target = document.documentElement;
  const request = target.requestFullscreen || target.webkitRequestFullscreen;
  if (!request) return;

  fullscreenRequestPending = true;
  try {
    const result = target.requestFullscreen
      ? target.requestFullscreen()
      : target.webkitRequestFullscreen();
    if (result && typeof result.then === 'function') {
      result.catch(function() {
        // 浏览器可拒绝全屏申请；保留游戏并允许下次用户手势重试。
      }).finally(function() {
        fullscreenRequestPending = false;
      });
    } else {
      fullscreenRequestPending = false;
    }
  } catch (error) {
    fullscreenRequestPending = false;
  }
}

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const nextPortraitBlocked = touchEnabled && window.innerHeight > window.innerWidth;
  if (nextPortraitBlocked !== portraitBlocked) {
    portraitBlocked = nextPortraitBlocked;
    if (!initialResize) {
      clearTouchInput(true);
      lastTime = 0;
      accumulator = 0;
    }
  }
  document.body.classList.toggle('portrait-blocked', portraitBlocked);
  initialResize = false;
}
window.addEventListener('resize', resize);
resize();

const G = 500;
const THRUST_MAX = 200;
const ROT_SPEED = 2.5;
const TRAIL_LEN = 300;
const FIXED_DT = 1 / 60;

const bodies = [
  { x: 300, y: 400, mass: 5000, radius: 35, label: '天体 A' },
  { x: 1200, y: 400, mass: 3000, radius: 25, label: '天体 B' }
];

const ship = { x: 0, y: 0, vx: 0, vy: 0, angle: 0, throttle: 0 };
let trail = [];
let stars = [];
let gameState = 'TITLE';
let keys = {};
let pauseBtnRects = [];
let lastTime = 0;
let accumulator = 0;

const ORBIT_R_OFFSET = 120;
const TARGET_ORBIT_MIN = 60;
const TARGET_ORBIT_MAX = 300;
const MOBILE_TARGET_ORBIT_MIN = 100;
const MOBILE_TARGET_ORBIT_MAX = 180;
const MOBILE_ORBIT_CONFIRM_SECONDS = 5;
const ORBIT_MIN = 0;
const ORBIT_MAX = 1000;
const ESCAPE_DIST = 3000;
const STABILITY_POS_THRESHOLD = 0.10;
const STABILITY_VEL_THRESHOLD = 0.15;
const STABILITY_CONFIRM_FRAMES = 5;

let orbitData = null;
let orbitReady = false;
let orbitAngleStart = 0;
let orbitAngleTotal = 0;
let orbitConfirmTime = 0;
let orbitWinQueued = false;
let orbitStable = false;
let stabilityConfirmCount = 0;
let lastPeriAlt = -1;
let lastApoAlt = -1;
let orbitStableA = false;
let stabilityConfirmCountA = 0;
let lastPeriAltA = -1;
let lastApoAltA = -1;
let debugMode = false;
let fuelUsed = 0;
let totalScore = 0;
let fuelScore = 0;
let targetOrbitScore = 0;
let targetOrbitGap = 0;
let dominantBody = bodies[0];
let prevDominantBody = bodies[0];
let starCanvas = null;
let frameCount = 0;

const touchInput = {
  steeringPointer: null,
  steeringActive: false,
  steeringTarget: 0,
  throttlePointer: null,
  throttleActive: false,
  throttleReturning: false,
  throttleValue: 0
};
const JOYSTICK_DEAD_ZONE = 0.18;
const THROTTLE_RETURN_RATE = 4; // 约 0.25 秒从满油门回到零

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function distanceToRange(value, min, max) {
  if (value < min) return min - value;
  if (value > max) return value - max;
  return 0;
}

function calculateMobileScore(analysis) {
  const periGap = distanceToRange(analysis.periAlt, MOBILE_TARGET_ORBIT_MIN, MOBILE_TARGET_ORBIT_MAX);
  const apoGap = distanceToRange(analysis.apoAlt, MOBILE_TARGET_ORBIT_MIN, MOBILE_TARGET_ORBIT_MAX);
  targetOrbitGap = (periGap + apoGap) / 2;
  fuelScore = Math.max(0, 500 - fuelUsed * 40);
  targetOrbitScore = Math.max(0, 500 - targetOrbitGap * 2);
  totalScore = Math.round(fuelScore + targetOrbitScore);
}

function clearTouchInput(immediateThrottle) {
  touchInput.steeringPointer = null;
  touchInput.steeringActive = false;
  touchInput.throttlePointer = null;
  touchInput.throttleActive = false;
  touchInput.throttleReturning = !immediateThrottle && ship.throttle > 0;
  touchInput.throttleValue = immediateThrottle ? 0 : ship.throttle;
  if (immediateThrottle) ship.throttle = 0;
  joystickKnob.style.transform = 'translate(-50%, -50%)';
  resetJoystickPosition();
  updateThrottleVisual(immediateThrottle ? 0 : ship.throttle);
}

function updateThrottleVisual(value) {
  const pct = clamp(value, 0, 1) * 100;
  throttleFill.style.height = pct + '%';
  throttleHandle.style.bottom = pct + '%';
  throttleValue.textContent = Math.round(pct) + '%';
}

function positionJoystickAt(clientX, clientY) {
  const zoneRect = joystickZone.getBoundingClientRect();
  const size = joystick.getBoundingClientRect().width;
  const radius = size / 2;
  const edgePadding = 22;
  const cx = clamp(clientX - zoneRect.left, radius + edgePadding, zoneRect.width - radius - edgePadding);
  const cy = clamp(clientY - zoneRect.top, radius + edgePadding, zoneRect.height - radius - edgePadding);

  joystick.style.left = (cx - radius) + 'px';
  joystick.style.top = (cy - radius) + 'px';
  joystick.style.bottom = 'auto';
  joystick.style.opacity = '1';
}

function resetJoystickPosition() {
  joystick.style.left = '';
  joystick.style.top = '';
  joystick.style.bottom = '';
  joystick.style.opacity = '';
}

function updateJoystickPointer(e) {
  const rect = joystick.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  const radius = rect.width / 2;
  const distance = Math.hypot(dx, dy);
  const limited = Math.min(distance, radius * 0.72);
  const nx = distance > 0 ? dx / distance : 0;
  const ny = distance > 0 ? dy / distance : 0;

  joystickKnob.style.transform = `translate(calc(-50% + ${nx * limited}px), calc(-50% + ${ny * limited}px))`;
  touchInput.steeringActive = distance >= radius * JOYSTICK_DEAD_ZONE;
  if (touchInput.steeringActive) touchInput.steeringTarget = Math.atan2(dy, dx);
}

function updateThrottlePointer(e) {
  const rect = throttleTrack.getBoundingClientRect();
  touchInput.throttleValue = clamp((rect.bottom - e.clientY) / rect.height, 0, 1);
  updateThrottleVisual(touchInput.throttleValue);
}

function generateStars() {
  stars = [];
  for (let i = 0; i < 300; i++) {
    stars.push({
      x: Math.random() * 3000 - 500,
      y: Math.random() * 2000 - 200,
      brightness: Math.random() * 0.5 + 0.3
    });
  }
  starCanvas = document.createElement('canvas');
  starCanvas.width = 3000;
  starCanvas.height = 2000;
  const sctx = starCanvas.getContext('2d');
  for (const s of stars) {
    const c = Math.floor(s.brightness * 255);
    sctx.fillStyle = `rgb(${c},${c},${c})`;
    sctx.fillRect(Math.floor(s.x + 500), Math.floor(s.y + 200), 1, 1);
  }
}

function initShip() {
  const b = bodies[0];
  const r = b.radius + ORBIT_R_OFFSET;
  const v = Math.sqrt(G * b.mass / r);
  ship.x = b.x + r;
  ship.y = b.y;
  ship.vx = 0;
  ship.vy = -v;
  ship.angle = -Math.PI / 2;
  ship.throttle = 0;
  trail = [];
  orbitData = null;
  orbitReady = false;
  orbitAngleStart = 0;
  orbitAngleTotal = 0;
  orbitConfirmTime = 0;
  orbitWinQueued = false;
  orbitStable = false;
  stabilityConfirmCount = 0;
  lastPeriAlt = -1;
  lastApoAlt = -1;
  orbitStableA = false;
  stabilityConfirmCountA = 0;
  lastPeriAltA = -1;
  lastApoAltA = -1;
  fuelUsed = 0;
  totalScore = 0;
  fuelScore = 0;
  targetOrbitScore = 0;
  targetOrbitGap = 0;
  dominantBody = bodies[0];
  prevDominantBody = bodies[0];
}

function resetGame() {
  initShip();
  clearTouchInput(true);
  gameState = 'PLAYING';
  lastTime = 0;
  accumulator = 0;
}

function gravity(ax, ay, bx, by, mass) {
  const dx = bx - ax;
  const dy = by - ay;
  const distSq = dx * dx + dy * dy;
  const dist = Math.sqrt(distSq);
  if (dist < 1) return { x: 0, y: 0 };
  const force = G * mass / distSq;
  return { x: force * dx / dist, y: force * dy / dist };
}

function predictOrbit(body) {
  const points = [];
  let px = ship.x, py = ship.y;
  let pvx = ship.vx, pvy = ship.vy;
  const steps = 2400;
  const dt = FIXED_DT;
  for (let i = 0; i < steps; i++) {
    points.push({ x: px, y: py });
    const g = gravity(px, py, body.x, body.y, body.mass);
    pvx += g.x * dt;
    pvy += g.y * dt;
    px += pvx * dt;
    py += pvy * dt;
    const dx = px - body.x;
    const dy = py - body.y;
    if (Math.sqrt(dx * dx + dy * dy) < body.radius) break;
  }
  return points;
}

function analyzeOrbit(body) {
  const dx = ship.x - body.x;
  const dy = ship.y - body.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  const speed = Math.sqrt(ship.vx * ship.vx + ship.vy * ship.vy);
  const GM = G * body.mass;
  const a = 1 / (2 / dist - speed * speed / GM);
  const period = 2 * Math.PI * Math.sqrt(Math.abs(a) * Math.abs(a) * Math.abs(a) / GM);
  const steps = Math.min(Math.ceil(period / FIXED_DT), 3000);

  let px = ship.x, py = ship.y;
  let pvx = ship.vx, pvy = ship.vy;
  let minDist = dist, maxDist = dist;
  let periPt = { x: px, y: py }, apoPt = { x: px, y: py };
  for (let i = 0; i < steps; i++) {
    const g = gravity(px, py, body.x, body.y, body.mass);
    pvx += g.x * FIXED_DT;
    pvy += g.y * FIXED_DT;
    px += pvx * FIXED_DT;
    py += pvy * FIXED_DT;
    const d = Math.sqrt((px - body.x) ** 2 + (py - body.y) ** 2);
    if (d < minDist) { minDist = d; periPt = { x: px, y: py }; }
    if (d > maxDist) { maxDist = d; apoPt = { x: px, y: py }; }
    const dd = Math.sqrt((px - ship.x) ** 2 + (py - ship.y) ** 2);
    if (i > steps * 0.5 && dd < Math.abs(a) * 0.15) {
      return {
        closed: true,
        periAlt: minDist - body.radius,
        apoAlt: maxDist - body.radius,
        avgAlt: (minDist + maxDist) / 2 - body.radius,
        periPoint: periPt,
        apoPoint: apoPt
      };
    }
  }

  return {
    closed: false,
    periAlt: minDist - body.radius,
    apoAlt: maxDist - body.radius,
    avgAlt: (minDist + maxDist) / 2 - body.radius,
    periPoint: periPt,
    apoPoint: apoPt
  };
}

function update(dt) {
  if (gameState !== 'PLAYING' || portraitBlocked) return;

  if (touchInput.steeringActive) {
    const angleDiff = Math.atan2(
      Math.sin(touchInput.steeringTarget - ship.angle),
      Math.cos(touchInput.steeringTarget - ship.angle)
    );
    ship.angle += clamp(angleDiff, -ROT_SPEED * dt, ROT_SPEED * dt);
  } else {
    if (keys['ArrowLeft'] || keys['KeyA']) ship.angle -= ROT_SPEED * dt;
    if (keys['ArrowRight'] || keys['KeyD']) ship.angle += ROT_SPEED * dt;
  }

  if (touchInput.throttleActive) {
    ship.throttle = touchInput.throttleValue;
  } else if (touchInput.throttleReturning) {
    ship.throttle = Math.max(0, ship.throttle - THROTTLE_RETURN_RATE * dt);
    touchInput.throttleValue = ship.throttle;
    if (ship.throttle === 0) touchInput.throttleReturning = false;
  } else if (keys['ArrowUp'] || keys['KeyW']) {
    ship.throttle = Math.min(1, ship.throttle + 1.5 * dt);
  } else if (keys['ArrowDown'] || keys['KeyS']) {
    ship.throttle = Math.max(0, ship.throttle - 1.5 * dt);
  } else {
    ship.throttle = Math.max(0, ship.throttle - 0.3 * dt);
  }

  let ax = 0, ay = 0;
  let minDist = Infinity;
  let closestBody = bodies[0];
  for (const b of bodies) {
    const dx = ship.x - b.x;
    const dy = ship.y - b.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < minDist) {
      minDist = dist;
      closestBody = b;
    }
  }

  if (closestBody !== prevDominantBody) {
    const dxA = ship.x - bodies[0].x;
    const dyA = ship.y - bodies[0].y;
    const distA = Math.sqrt(dxA * dxA + dyA * dyA);
    const dxB = ship.x - bodies[1].x;
    const dyB = ship.y - bodies[1].y;
    const distB = Math.sqrt(dxB * dxB + dyB * dyB);
    const boundary = (distA + distB) / 2;
    if (closestBody === bodies[0] && distA < boundary * 0.8) {
      prevDominantBody = bodies[0];
    } else if (closestBody === bodies[1] && distB < boundary * 0.8) {
      prevDominantBody = bodies[1];
    }
  } else {
    prevDominantBody = closestBody;
  }
  dominantBody = prevDominantBody;
  const g = gravity(ship.x, ship.y, dominantBody.x, dominantBody.y, dominantBody.mass);
  ax = g.x;
  ay = g.y;

  if (ship.throttle > 0.01) {
    ax += THRUST_MAX * ship.throttle * Math.cos(ship.angle);
    ay += THRUST_MAX * ship.throttle * Math.sin(ship.angle);
  }

  fuelUsed += ship.throttle * dt;

  ship.vx += ax * dt;
  ship.vy += ay * dt;
  ship.x += ship.vx * dt;
  ship.y += ship.vy * dt;

  trail.push({ x: ship.x, y: ship.y });
  if (trail.length > TRAIL_LEN) trail.shift();

  for (const b of bodies) {
    const dx = ship.x - b.x;
    const dy = ship.y - b.y;
    const distSq = dx * dx + dy * dy;
    if (distSq < b.radius * b.radius) {
      gameState = 'CRASH';
      return;
    }
  }

  const dx2 = ship.x - bodies[1].x;
  const dy2 = ship.y - bodies[1].y;
  const dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
  const orbitR = dist2 - bodies[1].radius;

  if (dominantBody === bodies[1] && orbitR > ORBIT_MIN && orbitR < ORBIT_MAX) {
    if (!orbitStable) {
      const points = predictOrbit(bodies[1]);
      const analysis = analyzeOrbit(bodies[1]);
      orbitData = { points, analysis };
    }

    const analysis = orbitData ? orbitData.analysis : null;

    if (ship.throttle < 0.01 && analysis) {
      const periOk = lastPeriAlt < 0 || Math.abs(analysis.periAlt - lastPeriAlt) < 15;
      const apoOk = lastApoAlt < 0 || Math.abs(analysis.apoAlt - lastApoAlt) < 15;
      lastPeriAlt = analysis.periAlt;
      lastApoAlt = analysis.apoAlt;

      if (periOk && apoOk && analysis.closed) {
        stabilityConfirmCount++;
        if (stabilityConfirmCount >= STABILITY_CONFIRM_FRAMES) {
          orbitStable = true;
        }
      } else {
        stabilityConfirmCount = Math.max(0, stabilityConfirmCount - 1);
        if (stabilityConfirmCount === 0) orbitStable = false;
      }
    } else if (ship.throttle >= 0.01) {
      orbitStable = false;
      stabilityConfirmCount = 0;
      lastPeriAlt = -1;
      lastApoAlt = -1;
    }

    const mobileOrbitQualified = touchEnabled && analysis && orbitStable;
    const desktopOrbitQualified = !touchEnabled && analysis && analysis.periAlt > TARGET_ORBIT_MIN && analysis.apoAlt < TARGET_ORBIT_MAX && orbitStable;

    if (mobileOrbitQualified || desktopOrbitQualified) {
      if (!orbitReady) {
        orbitReady = true;
        orbitAngleStart = Math.atan2(ship.y - bodies[1].y, ship.x - bodies[1].x);
        orbitAngleTotal = 0;
        orbitConfirmTime = 0;
      } else {
        const curAngle = Math.atan2(ship.y - bodies[1].y, ship.x - bodies[1].x);
        let dAngle = curAngle - orbitAngleStart;
        if (dAngle > Math.PI) dAngle -= Math.PI * 2;
        if (dAngle < -Math.PI) dAngle += Math.PI * 2;
        orbitAngleTotal += dAngle;
        orbitAngleStart = curAngle;
        if (touchEnabled) orbitConfirmTime += dt;

        const mobileConfirmed = touchEnabled && (
          orbitConfirmTime >= MOBILE_ORBIT_CONFIRM_SECONDS ||
          Math.abs(orbitAngleTotal) >= Math.PI * 2
        );
        const desktopConfirmed = !touchEnabled && Math.abs(orbitAngleTotal) >= Math.PI * 2;

        if (mobileConfirmed || desktopConfirmed) {
          const a = orbitData.analysis;
          if (touchEnabled) {
            calculateMobileScore(a);
          } else {
            const desktopFuelScore = Math.max(0, 500 - fuelUsed * 50);
            const circularity = a.apoAlt + a.periAlt > 0 ? 1 - (a.apoAlt - a.periAlt) / (a.apoAlt + a.periAlt) : 0;
            const circularScore = Math.max(0, circularity * 500);
            totalScore = Math.round(desktopFuelScore + circularScore);
          }
          gameState = 'WIN';
          return;
        }
      }
    } else {
      orbitReady = false;
      orbitAngleTotal = 0;
      orbitConfirmTime = 0;
    }
  } else {
    orbitData = null;
    orbitReady = false;
    orbitAngleTotal = 0;
    orbitConfirmTime = 0;

    if (dominantBody === bodies[0]) {
      const dxA = ship.x - bodies[0].x;
      const dyA = ship.y - bodies[0].y;
      const distA = Math.sqrt(dxA * dxA + dyA * dyA);
      const orbitRA = distA - bodies[0].radius;

      if (ship.throttle < 0.01 && orbitRA > ORBIT_MIN && orbitRA < ORBIT_MAX) {
        const analysisA = analyzeOrbit(bodies[0]);
        const periOkA = lastPeriAltA < 0 || Math.abs(analysisA.periAlt - lastPeriAltA) < 15;
        const apoOkA = lastApoAltA < 0 || Math.abs(analysisA.apoAlt - lastApoAltA) < 15;
        lastPeriAltA = analysisA.periAlt;
        lastApoAltA = analysisA.apoAlt;

        if (periOkA && apoOkA && analysisA.closed) {
          stabilityConfirmCountA++;
          if (stabilityConfirmCountA >= STABILITY_CONFIRM_FRAMES) {
            orbitStableA = true;
          }
        } else {
          stabilityConfirmCountA = Math.max(0, stabilityConfirmCountA - 1);
          if (stabilityConfirmCountA === 0) orbitStableA = false;
        }
      } else if (ship.throttle >= 0.01) {
        orbitStableA = false;
        stabilityConfirmCountA = 0;
        lastPeriAltA = -1;
        lastApoAltA = -1;
      }
    } else {
      orbitStableA = false;
      stabilityConfirmCountA = 0;
      lastPeriAltA = -1;
      lastApoAltA = -1;
    }
  }

  let tooFar = true;
  for (const b of bodies) {
    const ddx = ship.x - b.x;
    const ddy = ship.y - b.y;
    if (ddx * ddx + ddy * ddy < ESCAPE_DIST * ESCAPE_DIST) {
      tooFar = false;
      break;
    }
  }
  if (tooFar) resetGame();
}

let camX = 0, camY = 0;

function drawBackground() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawStars() {
  const sx = -500 - camX + canvas.width / 2;
  const sy = -200 - camY + canvas.height / 2;
  ctx.drawImage(starCanvas, sx, sy);
}

function drawWorldText(text, x, y) {
  if (!touchEnabled) {
    ctx.fillText(text, x, y);
    return;
  }

  // 游戏世界已缩放；反向缩放文字，使手机端标签仍保持可读尺寸。
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(1 / MOBILE_WORLD_SCALE, 1 / MOBILE_WORLD_SCALE);
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

function worldLineWidth(width) {
  return touchEnabled ? width / MOBILE_WORLD_SCALE : width;
}

function worldDash(pattern) {
  return touchEnabled ? pattern.map(value => value / MOBILE_WORLD_SCALE) : pattern;
}

function drawBody(b) {
  const sx = b.x - camX + canvas.width / 2;
  const sy = b.y - camY + canvas.height / 2;

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = worldLineWidth(2);
  ctx.beginPath();
  ctx.arc(sx, sy, b.radius, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = '#555';
  ctx.lineWidth = worldLineWidth(1);
  ctx.beginPath();
  ctx.moveTo(sx - b.radius * 0.5, sy);
  ctx.lineTo(sx + b.radius * 0.5, sy);
  ctx.moveTo(sx, sy - b.radius * 0.5);
  ctx.lineTo(sx, sy + b.radius * 0.5);
  ctx.stroke();

  ctx.fillStyle = '#888';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  drawWorldText(b.label, sx, sy + b.radius + 14);
}

function drawTrail() {
  if (trail.length < 2) return;
  ctx.strokeStyle = '#333';
  ctx.lineWidth = worldLineWidth(1);
  ctx.beginPath();
  for (let i = 0; i < trail.length; i++) {
    const sx = trail[i].x - camX + canvas.width / 2;
    const sy = trail[i].y - camY + canvas.height / 2;
    if (i === 0) ctx.moveTo(sx, sy);
    else ctx.lineTo(sx, sy);
  }
  ctx.stroke();

  for (let i = 0; i < trail.length; i += 6) {
    const alpha = (i / trail.length) * 0.5;
    const sx = trail[i].x - camX + canvas.width / 2;
    const sy = trail[i].y - camY + canvas.height / 2;
    ctx.fillStyle = 'rgba(255,255,255,' + alpha.toFixed(2) + ')';
    const pixelSize = touchEnabled ? 1 / MOBILE_WORLD_SCALE : 1;
    ctx.fillRect(Math.round(sx), Math.round(sy), pixelSize, pixelSize);
  }
}

function drawShip() {
  const sx = ship.x - camX + canvas.width / 2;
  const sy = ship.y - camY + canvas.height / 2;

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(ship.angle);

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(10, 0);
  ctx.lineTo(-6, -5);
  ctx.lineTo(-4, 0);
  ctx.lineTo(-6, 5);
  ctx.closePath();
  ctx.fill();

  if (ship.throttle > 0.05) {
    const flameLen = 4 + ship.throttle * 12;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = worldLineWidth(1);
    for (let i = 0; i < 3; i++) {
      const offset = (i - 1) * 2;
      const len = flameLen * (0.6 + Math.random() * 0.4);
      ctx.beginPath();
      ctx.moveTo(-5, offset);
      ctx.lineTo(-5 - len, offset + (Math.random() - 0.5) * 2);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function drawHUD() {
  const speed = Math.sqrt(ship.vx * ship.vx + ship.vy * ship.vy);
  const dx2 = ship.x - bodies[1].x;
  const dy2 = ship.y - bodies[1].y;
  const dist2 = Math.sqrt(dx2 * dx2 + dy2 * dy2) - bodies[1].radius;
  const dx1 = ship.x - bodies[0].x;
  const dy1 = ship.y - bodies[0].y;
  const dist1 = Math.sqrt(dx1 * dx1 + dy1 * dy1) - bodies[0].radius;

  const barLen = touchEnabled ? 12 : 30;
  const filled = Math.floor(ship.throttle * barLen);
  const bar = '[' + '='.repeat(filled) + ' '.repeat(barLen - filled) + ']';

  ctx.fillStyle = '#fff';
  ctx.font = (touchEnabled ? '11px' : '12px') + ' monospace';
  ctx.textAlign = 'left';
  ctx.fillText('速度: ' + speed.toFixed(1), 12, 24);
  ctx.fillText('距 A: ' + dist1.toFixed(0), 12, 40);
  ctx.fillText('距 B: ' + dist2.toFixed(0), 12, 56);
  ctx.fillText('油门: ' + bar + ' ' + (ship.throttle * 100).toFixed(0) + '%', 12, 72);
  ctx.fillText('燃料: ' + fuelUsed.toFixed(1), 12, 88);

  if (gameState === 'PLAYING' && debugMode && dominantBody === bodies[1] && orbitData && orbitData.analysis) {
    const a = orbitData.analysis;
    ctx.fillStyle = '#0f0';
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    let dy = 110;
    ctx.fillText('[DEBUG]', 12, dy); dy += 14;
    ctx.fillText('closed: ' + a.closed, 12, dy); dy += 14;
    ctx.fillText('periAlt: ' + a.periAlt.toFixed(1), 12, dy); dy += 14;
    ctx.fillText('apoAlt: ' + a.apoAlt.toFixed(1), 12, dy); dy += 14;
    ctx.fillText('lastPeri: ' + lastPeriAlt.toFixed(1), 12, dy); dy += 14;
    ctx.fillText('lastApo: ' + lastApoAlt.toFixed(1), 12, dy); dy += 14;
    const periDiff = lastPeriAlt < 0 ? 0 : Math.abs(a.periAlt - lastPeriAlt);
    const apoDiff = lastApoAlt < 0 ? 0 : Math.abs(a.apoAlt - lastApoAlt);
    ctx.fillText('periDiff: ' + periDiff.toFixed(1) + (periDiff < 15 ? ' OK' : ' FAIL'), 12, dy); dy += 14;
    ctx.fillText('apoDiff: ' + apoDiff.toFixed(1) + (apoDiff < 15 ? ' OK' : ' FAIL'), 12, dy); dy += 14;
    ctx.fillText('confirm: ' + stabilityConfirmCount + '/' + STABILITY_CONFIRM_FRAMES, 12, dy); dy += 14;
    ctx.fillText('stable: ' + orbitStable, 12, dy); dy += 14;
    ctx.fillText('throttle: ' + ship.throttle.toFixed(3), 12, dy);
  }

  if (!touchEnabled) {
    ctx.textAlign = 'right';
    ctx.fillStyle = '#666';
    ctx.font = '10px monospace';
    const rx = canvas.width - 10;
    ctx.fillText('← → / A D  旋转姿态', rx, canvas.height - 44);
    ctx.fillText('↑ ↓ / W S  控制油门', rx, canvas.height - 32);
    ctx.fillText('空格/ESC 暂停  F1 Debug', rx, canvas.height - 20);
    ctx.textAlign = 'left';
  }

  if (gameState === 'PLAYING') {
    ctx.fillStyle = '#fff';
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    const cx = canvas.width / 2;
    const bottom = canvas.height - 12;

    if (ship.throttle >= 0.01) {
      ctx.fillText('变轨中', cx, bottom);
    } else if (dominantBody === bodies[1] && orbitData && orbitData.analysis) {
      const a = orbitData.analysis;
      if (touchEnabled) {
        if (orbitStable && orbitReady) {
          const timeProgress = orbitConfirmTime / MOBILE_ORBIT_CONFIRM_SECONDS;
          const lapProgress = Math.abs(orbitAngleTotal) / (Math.PI * 2);
          const victoryPct = Math.min(100, Math.max(timeProgress, lapProgress) * 100);
          ctx.fillText('天体B轨道 · 稳定 · 计圈中 ' + victoryPct.toFixed(0) + '%', cx, bottom);
        } else if (orbitStable) {
          ctx.fillText('天体B轨道 · 稳定 · 准备入轨', cx, bottom);
        } else {
          ctx.fillText('天体B轨道 · 稳定判定中 · 评分目标 ' + MOBILE_TARGET_ORBIT_MIN + '–' + MOBILE_TARGET_ORBIT_MAX, cx, bottom);
        }
      } else if (a.periAlt > TARGET_ORBIT_MIN && a.apoAlt < TARGET_ORBIT_MAX && orbitStable) {
        if (orbitReady) {
          const pct = Math.min(100, Math.abs(orbitAngleTotal) / (Math.PI * 2) * 100);
          ctx.fillText('天体B轨道 · 稳定 · 计圈中 ' + pct.toFixed(0) + '%', cx, bottom);
        } else {
          ctx.fillText('天体B轨道 · 稳定 · 准备入轨', cx, bottom);
        }
      } else if (orbitStable) {
        ctx.fillText('天体B轨道 · 稳定 · 高度不符 (近:' + a.periAlt.toFixed(0) + ' 远:' + a.apoAlt.toFixed(0) + ')', cx, bottom);
      } else {
        ctx.fillText('天体B轨道 · 未稳定', cx, bottom);
      }
    } else if (dominantBody === bodies[0]) {
      const dx0 = ship.x - bodies[0].x;
      const dy0 = ship.y - bodies[0].y;
      const dist0 = Math.sqrt(dx0 * dx0 + dy0 * dy0) - bodies[0].radius;
      if (dist0 > ORBIT_MIN && dist0 < ORBIT_MAX) {
        if (orbitStableA) {
          ctx.fillText('天体A轨道 · 稳定', cx, bottom);
        } else {
          ctx.fillText('天体A轨道 · 未稳定', cx, bottom);
        }
      } else {
        ctx.fillText('天体A区域 · 无轨道', cx, bottom);
      }
    } else {
      ctx.fillText('无轨道', cx, bottom);
    }
  }
}

function drawAssociationCredit() {
  ctx.fillStyle = '#555';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('西南交通大学科幻协会', canvas.width / 2, canvas.height - 16);
}

function drawTitle() {
  drawBackground();
  drawStars();

  const compactTouchLayout = touchEnabled && canvas.height < 500;
  const titleY = compactTouchLayout ? 52 : canvas.height / 2 - 80;
  ctx.fillStyle = '#fff';
  const titleSize = Math.max(28, Math.min(48, canvas.width / 12, canvas.height / 7));
  ctx.font = 'bold ' + titleSize + 'px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('轨 道 转 移', canvas.width / 2, titleY);

  ctx.font = '16px monospace';
  ctx.fillText('ORBITAL TRANSFER', canvas.width / 2, titleY + 35);

  const cx = canvas.width / 2;
  const cy = compactTouchLayout ? canvas.height * 0.39 : canvas.height / 2 + 20;
  const instructionY = compactTouchLayout ? cy + 70 : cy + 80;

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx - 100, cy, 12, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx + 100, cy, 8, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.beginPath();
  ctx.arc(cx - 100, cy, 50, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#fff';
  ctx.font = '12px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(touchEnabled ? '左摇杆  控制方向' : '← →  旋转姿态', cx, instructionY);
  ctx.fillText(touchEnabled ? '右推杆  控制油门' : '↑ ↓   控制油门', cx, instructionY + 20);
  ctx.fillText('将飞行器变轨至另一天体', cx, instructionY + 50);

  ctx.fillStyle = '#888';
  ctx.font = '14px monospace';
  const blink = Math.floor(Date.now() / 500) % 2;
  if (blink) {
    const startPrompt = touchEnabled
      ? (mobileStartArmed ? '[ 再次点击开始 ]' : '[ 点击进入全屏 ]')
      : '[ 按空格键开始 ]';
    ctx.fillText(startPrompt, cx, instructionY + 90);
  }

  drawAssociationCredit();
}

function drawOverlay(title, subtitle) {
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 40);

  ctx.font = '14px monospace';
  ctx.fillStyle = '#888';
  ctx.fillText(subtitle, canvas.width / 2, canvas.height / 2 - 10);

  if (title === '任 务 完 成') {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2 + 20;
    ctx.font = '14px monospace';
    ctx.fillStyle = '#aaa';
    if (touchEnabled) {
      ctx.fillText('燃料得分: ' + Math.round(fuelScore) + ' / 500', cx, cy);
      ctx.fillText('目标范围差距: ' + targetOrbitGap.toFixed(1), cx, cy + 20);
      ctx.fillText('轨道得分: ' + Math.round(targetOrbitScore) + ' / 500', cx, cy + 40);
    } else {
      ctx.fillText('燃料效率: ' + Math.max(0, 500 - fuelUsed * 50).toFixed(0), cx, cy);
      const a = orbitData ? orbitData.analysis : null;
      if (a && a.apoAlt + a.periAlt > 0) {
        const circ = 1 - (a.apoAlt - a.periAlt) / (a.apoAlt + a.periAlt);
        ctx.fillText('轨道圆度: ' + (circ * 500).toFixed(0), cx, cy + 20);
      }
    }
    ctx.fillStyle = '#fff';
    ctx.font = touchEnabled ? 'bold 22px monospace' : 'bold 24px monospace';
    ctx.fillText('总分: ' + totalScore, cx, cy + (touchEnabled ? 70 : 55));
  }

  const blink = Math.floor(Date.now() / 500) % 2;
  if (blink) {
    ctx.fillStyle = '#fff';
    ctx.font = '14px monospace';
    const restartY = canvas.height / 2 + (touchEnabled && title === '任 务 完 成' ? 125 : 90);
    ctx.fillText(touchEnabled ? '[ 点击屏幕重新开始 ]' : '[ 按空格键重新开始 ]', canvas.width / 2, restartY);
  }

  drawAssociationCredit();
}

function togglePause() {
  if (gameState === 'PLAYING') {
    gameState = 'PAUSED';
    keys = {};
    clearTouchInput(true);
  } else if (gameState === 'PAUSED') {
    gameState = 'PLAYING';
    lastTime = 0;
    accumulator = 0;
  }
}

function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 36px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('暂 停', canvas.width / 2, canvas.height / 2 - 60);

  pauseBtnRects = [];
  const bw = 180, bh = 40;
  const cx = canvas.width / 2;

  const continueY = canvas.height / 2 - 10;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.strokeRect(cx - bw / 2, continueY, bw, bh);
  ctx.fillStyle = '#fff';
  ctx.font = '16px monospace';
  ctx.fillText('继 续', cx, continueY + 27);
  pauseBtnRects.push({ x: cx - bw / 2, y: continueY, w: bw, h: bh, action: 'resume' });

  const restartY = canvas.height / 2 + 50;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.strokeRect(cx - bw / 2, restartY, bw, bh);
  ctx.fillStyle = '#fff';
  ctx.fillText('重新开始', cx, restartY + 27);
  pauseBtnRects.push({ x: cx - bw / 2, y: restartY, w: bw, h: bh, action: 'restart' });
}

function drawOffscreenIndicator() {
  const target = bodies[1];
  const worldScale = touchEnabled ? MOBILE_WORLD_SCALE : 1;
  const sx = (target.x - camX) * worldScale + canvas.width / 2;
  const sy = (target.y - camY) * worldScale + canvas.height / 2;
  const margin = 40;

  if (sx >= 0 && sx <= canvas.width && sy >= 0 && sy <= canvas.height) return;

  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const angle = Math.atan2(target.y - camY, target.x - camX);
  const edgeX = Math.max(margin, Math.min(canvas.width - margin, cx + Math.cos(angle) * (canvas.width / 2 - margin)));
  const edgeY = Math.max(margin, Math.min(canvas.height - margin, cy + Math.sin(angle) * (canvas.height / 2 - margin)));

  ctx.save();
  ctx.translate(edgeX, edgeY);
  ctx.rotate(angle);

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(12, 0);
  ctx.lineTo(-4, -6);
  ctx.lineTo(-4, 6);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  const dist = Math.sqrt((target.x - ship.x) ** 2 + (target.y - ship.y) ** 2);
  ctx.fillStyle = '#888';
  ctx.font = '10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('天体 B', edgeX, edgeY - 12);
  ctx.fillText(Math.floor(dist), edgeX, edgeY + 18);
}

function drawOrbitPrediction() {
  const body = bodies[1];
  const sx = body.x - camX + canvas.width / 2;
  const sy = body.y - camY + canvas.height / 2;
  const targetMin = touchEnabled ? MOBILE_TARGET_ORBIT_MIN : TARGET_ORBIT_MIN;
  const targetMax = touchEnabled ? MOBILE_TARGET_ORBIT_MAX : TARGET_ORBIT_MAX;

  ctx.strokeStyle = '#333';
  ctx.lineWidth = worldLineWidth(1);
  ctx.setLineDash(worldDash([4, 6]));
  ctx.beginPath();
  ctx.arc(sx, sy, targetMin + body.radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(sx, sy, targetMax + body.radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = '#444';
  ctx.font = '14px monospace';
  ctx.textAlign = 'left';
  drawWorldText(touchEnabled ? '评分目标' : '目标轨道', sx + targetMax + body.radius + 4, sy);

  if (!orbitData) return;

  ctx.strokeStyle = '#fff';
  ctx.lineWidth = worldLineWidth(1);
  ctx.setLineDash(worldDash([6, 4]));
  ctx.beginPath();
  for (let i = 0; i < orbitData.points.length; i++) {
    const px = orbitData.points[i].x - camX + canvas.width / 2;
    const py = orbitData.points[i].y - camY + canvas.height / 2;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  if (!orbitData || !orbitStable) return;

  const a = orbitData.analysis;

  if (a.isCircular) {
    const r = a.avgAlt + body.radius;
    ctx.strokeStyle = '#666';
    ctx.lineWidth = worldLineWidth(1);
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.stroke();

    const labelX = sx + r + 6;
    const labelY = sy;
    ctx.fillStyle = '#aaa';
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    drawWorldText('h=' + a.avgAlt.toFixed(0), labelX, labelY + 4);
  } else {
    const periR = a.periAlt + body.radius;
    const apoR = a.apoAlt + body.radius;

    ctx.strokeStyle = '#444';
    ctx.lineWidth = worldLineWidth(1);
    ctx.beginPath();
    ctx.arc(sx, sy, periR, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(sx, sy, apoR, 0, Math.PI * 2);
    ctx.stroke();

    const periSx = a.periPoint.x - camX + canvas.width / 2;
    const periSy = a.periPoint.y - camY + canvas.height / 2;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(periSx, periSy, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#aaa';
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    drawWorldText('近 ' + a.periAlt.toFixed(0), periSx, periSy - 8);

    const apoSx = a.apoPoint.x - camX + canvas.width / 2;
    const apoSy = a.apoPoint.y - camY + canvas.height / 2;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(apoSx, apoSy, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#aaa';
    drawWorldText('远 ' + a.apoAlt.toFixed(0), apoSx, apoSy - 8);
  }
}

function render() {
  document.body.classList.toggle('state-playing', gameState === 'PLAYING');
  if (touchEnabled && !touchInput.throttleActive) updateThrottleVisual(ship.throttle);

  if (gameState === 'TITLE') {
    drawTitle();
    return;
  }

  camX += (ship.x - camX) * 0.1;
  camY += (ship.y - camY) * 0.1;

  drawBackground();
  ctx.save();
  if (touchEnabled) {
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(MOBILE_WORLD_SCALE, MOBILE_WORLD_SCALE);
    ctx.translate(-canvas.width / 2, -canvas.height / 2);
  }
  drawStars();
  drawTrail();
  for (const b of bodies) drawBody(b);
  drawOrbitPrediction();
  drawShip();
  ctx.restore();
  drawHUD();
  drawOffscreenIndicator();

  ctx.fillStyle = '#888';
  ctx.font = '14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(touchEnabled ? '目标：抵达天体 B 的稳定轨道' : '任务目标：将飞行器从天体A变轨至天体B', canvas.width / 2, 24);
  ctx.font = '12px monospace';
  if (!touchEnabled || canvas.height > 390) {
    ctx.fillText(touchEnabled ? '尽可能节省燃料·尽可能贴近轨道' : '尽可能节省燃料 · 使轨道尽可能圆', canvas.width / 2, 42);
  }

  if (gameState === 'WIN') drawOverlay('任 务 完 成', touchEnabled ? '天体 B 稳定轨道确认完成' : '成功变轨至目标天体');
  if (gameState === 'CRASH') drawOverlay('坠 毁', '飞行器撞击天体表面');
  if (gameState === 'PAUSED') drawPause();
}

function gameLoop(timestamp) {
  if (lastTime === 0) lastTime = timestamp;
  let delta = (timestamp - lastTime) / 1000;
  lastTime = timestamp;

  if (delta > 0.1) delta = 0.1;

  accumulator += delta;
  while (accumulator >= FIXED_DT) {
    update(FIXED_DT);
    accumulator -= FIXED_DT;
  }

  frameCount++;
  render();
  requestAnimationFrame(gameLoop);
}

window.addEventListener('keydown', function(e) {
  keys[e.code] = true;
  if (e.key === 'F1') {
    debugMode = !debugMode;
    e.preventDefault();
  }
  if (e.code === 'Space' || e.code === 'Escape') {
    e.preventDefault();
    if (gameState === 'PLAYING' || gameState === 'PAUSED') {
      togglePause();
    } else if (gameState === 'TITLE' || gameState === 'WIN' || gameState === 'CRASH') {
      resetGame();
    }
  }
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) {
    e.preventDefault();
  }
});

window.addEventListener('keyup', function(e) {
  keys[e.code] = false;
});

joystickZone.addEventListener('pointerdown', function(e) {
  if (gameState !== 'PLAYING' || portraitBlocked || touchInput.steeringPointer !== null) return;
  e.preventDefault();
  requestMobileFullscreen();
  touchInput.steeringPointer = e.pointerId;
  positionJoystickAt(e.clientX, e.clientY);
  joystickZone.setPointerCapture(e.pointerId);
  updateJoystickPointer(e);
});

joystickZone.addEventListener('pointermove', function(e) {
  if (e.pointerId !== touchInput.steeringPointer) return;
  e.preventDefault();
  updateJoystickPointer(e);
});

function releaseSteering(e) {
  if (e.pointerId !== touchInput.steeringPointer) return;
  touchInput.steeringPointer = null;
  touchInput.steeringActive = false;
  joystickKnob.style.transform = 'translate(-50%, -50%)';
  resetJoystickPosition();
}

joystickZone.addEventListener('pointerup', releaseSteering);
joystickZone.addEventListener('pointercancel', releaseSteering);

throttleTrack.addEventListener('pointerdown', function(e) {
  if (gameState !== 'PLAYING' || portraitBlocked || touchInput.throttlePointer !== null) return;
  e.preventDefault();
  requestMobileFullscreen();
  touchInput.throttlePointer = e.pointerId;
  touchInput.throttleActive = true;
  touchInput.throttleReturning = false;
  throttleTrack.setPointerCapture(e.pointerId);
  updateThrottlePointer(e);
});

throttleTrack.addEventListener('pointermove', function(e) {
  if (e.pointerId !== touchInput.throttlePointer) return;
  e.preventDefault();
  updateThrottlePointer(e);
});

function releaseThrottle(e) {
  if (e.pointerId !== touchInput.throttlePointer) return;
  touchInput.throttlePointer = null;
  touchInput.throttleActive = false;
  touchInput.throttleReturning = ship.throttle > 0;
}

throttleTrack.addEventListener('pointerup', releaseThrottle);
throttleTrack.addEventListener('pointercancel', function(e) {
  if (e.pointerId !== touchInput.throttlePointer) return;
  touchInput.throttlePointer = null;
  touchInput.throttleActive = false;
  touchInput.throttleReturning = false;
  touchInput.throttleValue = 0;
  ship.throttle = 0;
  updateThrottleVisual(0);
});

pauseButton.addEventListener('click', function(e) {
  e.preventDefault();
  e.stopPropagation();
  if (gameState === 'PLAYING') togglePause();
});

canvas.addEventListener('click', function(e) {
  if (portraitBlocked) return;

  if (gameState === 'TITLE') {
    if (touchEnabled && !mobileStartArmed) {
      mobileStartArmed = true;
      requestMobileFullscreen();
      return;
    }
    resetGame();
    return;
  }

  requestMobileFullscreen();
  if (gameState === 'WIN' || gameState === 'CRASH') {
    resetGame();
    return;
  }
  if (gameState !== 'PAUSED') return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  for (const btn of pauseBtnRects) {
    if (mx >= btn.x && mx <= btn.x + btn.w && my >= btn.y && my <= btn.y + btn.h) {
      if (btn.action === 'resume') togglePause();
      else if (btn.action === 'restart') resetGame();
      break;
    }
  }
});

window.addEventListener('blur', function() {
  keys = {};
  clearTouchInput(true);
});

document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    keys = {};
    clearTouchInput(true);
    lastTime = 0;
    accumulator = 0;
  }
});

document.addEventListener('fullscreenchange', resize);
document.addEventListener('webkitfullscreenchange', resize);

canvas.style.cursor = 'pointer';

generateStars();
initShip();
camX = ship.x;
camY = ship.y;
gameLoop();
</script>
</body>
</html>
